# Lefthook configuration
# Refer to https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,js}"
      run: npm run lint

pre-push:
  commands:
    test:
      run: go vet ./... && go test ./host/... && npm run build && npm test && npm run host:build-test && npm run test:conformance
